<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Whisper</title>
<style>:root{color-scheme:dark;font-family:system-ui}body{max-width:780px;margin:48px auto;padding:0 20px;background:#111827;color:#f9fafb}button{padding:11px 16px;margin-right:8px;border:0;border-radius:8px;cursor:pointer}#start{background:#22c55e}#stop{background:#ef4444;color:#fff}button:disabled{opacity:.45}#status,#mode{color:#93c5fd;margin:12px 0;min-height:24px}#mode{color:#a7f3d0}#text{white-space:pre-wrap;min-height:160px;padding:20px;border-radius:10px;background:#1f2937;font-size:21px;line-height:1.5}table{width:100%;margin-top:18px;border-collapse:collapse;background:#1f2937}caption{text-align:left;padding:14px;font-weight:600}th,td{padding:10px 16px;border-top:1px solid #374151;text-align:left}th{color:#9ca3af;width:58%}</style></head>
<body><h1>Live Whisper</h1><p>Tarayici mikrofonu uzaktaki Silero VAD ve Whisper GPU sunucusuna aktarilir.</p><button id="start">Mikrofonu baslat</button><button id="stop" disabled>Durdur</button><div id="status">Hazir</div><div id="mode">Mod: baglanti bekleniyor</div><div id="text">Transkript burada gorunecek...</div><table><caption>Konusma turu metrikleri</caption><tbody><tr><th>Inference sayisi</th><td id="count">0</td></tr><tr><th>Son inference suresi</th><td id="last">-</td></tr><tr><th>Toplam inference suresi</th><td id="total">-</td></tr><tr><th>Islenen ses suresi</th><td id="audio">-</td></tr><tr><th>RTF</th><td id="rtf">-</td></tr></tbody></table>
<script>const start=document.querySelector('#start'),stop=document.querySelector('#stop'),status=document.querySelector('#status'),mode=document.querySelector('#mode'),text=document.querySelector('#text'),m={count:document.querySelector('#count'),last:document.querySelector('#last'),total:document.querySelector('#total'),audio:document.querySelector('#audio'),rtf:document.querySelector('#rtf')};let ws,stream,ctx,source,processor;function reset(){m.count.textContent='0';m.last.textContent=m.total.textContent=m.audio.textContent=m.rtf.textContent='-'}function encode(x,r){const q=r/16000,n=Math.round(x.length/q),o=new Int16Array(n);for(let i=0;i<n;i++){const p=i*q,l=Math.floor(p),z=x[l]+(x[Math.min(l+1,x.length-1)]-x[l])*(p-l);o[i]=Math.max(-1,Math.min(1,z))*32767}return o.buffer}function modeText(x){return x.mode==='final_only'?'final_only (yalnizca final inference)':`${x.mode} (${x.partial_interval_seconds} sn partial araligi)`}start.onclick=async()=>{try{status.textContent='Connecting...';stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='ready'){status.textContent='Connected';mode.textContent=`Mod: ${modeText(x)}`}if(x.type==='speech_start'){status.textContent='Konusma algilandi';text.textContent=''}if(x.type==='speech_end')status.textContent='Konusma tamamlandi';if(x.type==='error')status.textContent=x.message;if(x.type==='metrics_reset')reset();if(x.type==='metrics'){m.count.textContent=x.inference_count;m.last.textContent=`${x.last_inference_ms} ms`;m.total.textContent=`${x.total_inference_ms} ms`;m.audio.textContent=`${x.audio_seconds} s`;m.rtf.textContent=x.rtf}if(x.type==='transcript'&&x.text)text.textContent=x.text};ws.onerror=()=>status.textContent='WebSocket hatasi';ctx=new AudioContext();await ctx.resume();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(ws.readyState===WebSocket.OPEN)ws.send(encode(e.inputBuffer.getChannelData(0),ctx.sampleRate))};source.connect(processor);processor.connect(ctx.destination);start.disabled=true;stop.disabled=false}catch(e){status.textContent=`Mikrofon hatasi: ${e.message}`}};stop.onclick=()=>{processor?.disconnect();source?.disconnect();ctx?.close();stream?.getTracks().forEach(t=>t.stop());ws?.close();start.disabled=false;stop.disabled=true;status.textContent='Durduruldu'};</script></body></html>
